<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Acres</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">AGENT ACRES</div>
    <div class="stats" id="stats"></div>
    <div class="right">
      <div class="badge" id="commander"></div>
      <span class="conn" id="conn">connecting&hellip;</span>
      <a class="btn" href="/gallery.html" title="Approve or deny the character sprites workers can use">SPRITES</a>
      <button id="camBtn" title="Director camera: follows whoever just did something">CAM: FREE</button>
      <button id="demoBtn" title="Simulate all agents (demo events are never saved)">DEMO: OFF</button>
    </div>
  </header>
  <main>
    <aside class="left">
      <div class="panel grow">
        <h2><span class="sq"></span>CREW <span class="count" id="crewCount"></span></h2>
        <ul id="crew" class="crew"></ul>
      </div>
    </aside>
    <section class="floor">
      <canvas id="world"></canvas>
      <div class="live"><span class="dot"></span>LIVE</div>
      <div class="banner" id="banner" hidden></div>
      <div class="hud">
        <div class="label">EARNED TODAY</div>
        <div class="money" id="hudMoney">$0</div>
        <div class="sub" id="hudStats"></div>
      </div>
      <div class="toasts" id="toasts"></div>
    </section>
    <aside class="right-col">
      <div class="panel grow">
        <div class="tabs">
          <button class="tab active" data-tab="done"><span class="sq"></span>COMMS <span class="count" id="doneCount"></span></button>
          <button class="tab" data-tab="feed">FEED</button>
          <span class="filter" id="filter" hidden></span>
        </div>
        <ul id="done" class="comms"></ul>
        <ul id="feed" class="feed" hidden></ul>
      </div>
    </aside>
  </main>
  <footer id="credit"></footer>
  <script src="/shared/reducer.js"></script>
  <script src="/sprites.js"></script>
  <script src="/world.js"></script>
  <script src="/app.js"></script>
</body>
</html>
