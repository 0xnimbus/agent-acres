<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Agent Acres: a pixel robot with a sprout on its antenna (agents + acres). Original art. -->
  <rect width="16" height="16" rx="3" fill="#0a1130"/>
  <!-- sprout -->
  <rect x="7" y="1" width="2" height="1" fill="#4cff8f"/>
  <rect x="6" y="2" width="1" height="1" fill="#4cff8f"/>
  <rect x="9" y="2" width="1" height="1" fill="#2fbf71"/>
  <rect x="7" y="2" width="2" height="1" fill="#2fbf71"/>
  <!-- antenna -->
  <rect x="7" y="3" width="2" height="2" fill="#8fa3c0"/>
  <!-- head -->
  <rect x="3" y="5" width="10" height="8" fill="#7fa4ff"/>
  <rect x="3" y="5" width="10" height="1" fill="#b9ccff"/>
  <rect x="2" y="7" width="1" height="3" fill="#5a78c8"/>
  <rect x="13" y="7" width="1" height="3" fill="#5a78c8"/>
  <!-- visor and eyes -->
  <rect x="4" y="7" width="8" height="3" fill="#050816"/>
  <rect x="5" y="8" width="2" height="1" fill="#38e1ff"/>
  <rect x="9" y="8" width="2" height="1" fill="#38e1ff"/>
  <!-- mouth grille -->
  <rect x="6" y="11" width="4" height="1" fill="#3d4f8c"/>
  <!-- base glow -->
  <rect x="4" y="13" width="8" height="1" fill="#ffd65a"/>
</svg>
